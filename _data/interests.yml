# Research interests on the home page.

- name: Industrial Organization
  items: bargaining and contract theory, market structure and competition policy, platform economics, oligopoly models, firm strategy and entry deterrence, vertical integration

- name: Structural Microeconomics
  items: structural demand and supply estimation, auction and matching models, dynamic discrete choice, counterfactual policy simulation, program evaluation techniques

- name: Econometrics
  items: identification and partial identification, semiparametric and nonparametric estimation, dynamic panel and state-dependence models, inference for counterfactuals, simulation-based estimation of strategic models

- name: Microeconomic Theory
  items: game theory and mechanism design, information economics and signaling, repeated games and relational contracts, matching and market design, dynamic incentives and strategic interaction under uncertainty
