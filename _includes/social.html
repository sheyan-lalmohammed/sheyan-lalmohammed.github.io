<ul class="social" aria-label="Profiles">
  {%- if site.email %}<li><a href="mailto:{{ site.email }}" aria-label="Email"><i class="fa-solid fa-envelope"></i></a></li>{% endif %}
  {%- if site.google_scholar %}<li><a href="{{ site.google_scholar }}" target="_blank" rel="noopener" aria-label="Google Scholar"><i class="ai ai-google-scholar"></i></a></li>{% endif %}
  {%- if site.github %}<li><a href="{{ site.github }}" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a></li>{% endif %}
  {%- if site.linkedin %}<li><a href="{{ site.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a></li>{% endif %}
  {%- if site.cv %}<li><a href="{% include url.html u=site.cv %}" target="_blank" rel="noopener" aria-label="CV"><i class="ai ai-cv"></i></a></li>{% endif %}
</ul>
