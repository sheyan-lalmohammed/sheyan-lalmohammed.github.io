<header class="nav" data-nav>
  <a class="nav__brand" href="{{ '/' | relative_url }}" aria-label="Home">
    <span class="nav__mark">SL</span>
    <span class="nav__name">{{ site.title }}</span>
  </a>
  <nav class="nav__links" aria-label="Primary">
    <a href="{{ '/#story' | relative_url }}">Story</a>
    <a href="{{ '/#now' | relative_url }}">Now</a>
    <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Archive</a>
    <a href="{{ '/tools/' | relative_url }}"{% if page.url == '/tools/' %} aria-current="page"{% endif %}>Tools</a>
    {%- if site.cv %}
    <a class="nav__cv" href="{% include url.html u=site.cv %}" target="_blank" rel="noopener">CV <i class="fa-solid fa-arrow-down" aria-hidden="true"></i></a>
    {%- endif %}
  </nav>
</header>
